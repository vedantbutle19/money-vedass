<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="6" />

  <!-- Accent glow behind graph -->
  <circle cx="360" cy="180" r="100" fill="#10b981" opacity="0.12" filter="url(#glow)" />
  <circle cx="200" cy="300" r="120" fill="#6366f1" opacity="0.12" filter="url(#glow)" />

  <!-- Base baseline -->
  <line x1="96" y1="384" x2="416" y2="384" stroke="#334155" stroke-width="12" stroke-linecap="round" opacity="0.6" />

  <!-- Main Growth Trajectory Path -->
  <path d="M128 320 L216 232 L296 304 L384 160"
        fill="none"
        stroke="url(#lineGrad)"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Target Arrowhead -->
  <path d="M320 160 H384 V224"
        fill="none"
        stroke="#6366f1"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Milestone Nodes -->
  <circle cx="128" cy="320" r="18" fill="#10b981" stroke="#ffffff" stroke-width="8" />
  <circle cx="216" cy="232" r="18" fill="#14b8a6" stroke="#ffffff" stroke-width="8" />
  <circle cx="296" cy="304" r="18" fill="#3b82f6" stroke="#ffffff" stroke-width="8" />
  <circle cx="384" cy="160" r="22" fill="#6366f1" stroke="#ffffff" stroke-width="8" />
</svg>
